<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Mykola Voronin — Digital business card">
  <rect width="1200" height="630" fill="#111110"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowD)"/>
  <defs>
    <radialGradient id="glowD" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F7F5F2" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#F7F5F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="280" y="78" width="640" height="474" rx="36" fill="#1A1917" stroke="#2E2C29" stroke-width="1.5" filter="url(#shadowD)"/>
  <rect x="280" y="78" width="640" height="6" rx="3" fill="url(#barD)"/>
  <defs>
    <linearGradient id="barD" x1="280" y1="0" x2="920" y2="0">
      <stop offset="0%" stop-color="#F7F5F2" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#F7F5F2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F7F5F2" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Avatar circle -->
  <circle cx="600" cy="198" r="52" fill="#252320" stroke="#3A3732" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#F0EDE8">M</text>

  <text x="600" y="288" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" fill="#F0EDE8" letter-spacing="-0.5">Mykola Voronin</text>
  <text x="600" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#A39E97">Student</text>
  <text x="600" y="358" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#7A756E">Barcelona, Spain</text>

  <!-- QR placeholder frame -->
  <rect x="508" y="388" width="84" height="84" rx="12" fill="#F7F5F2" stroke="#3A3732" stroke-width="1.5"/>
  <rect x="520" y="400" width="18" height="18" rx="2" fill="#1A1816"/>
  <rect x="562" y="400" width="18" height="18" rx="2" fill="#1A1816"/>
  <rect x="520" y="442" width="18" height="18" rx="2" fill="#1A1816"/>
  <rect x="544" y="422" width="10" height="10" rx="1" fill="#1A1816"/>
  <rect x="562" y="442" width="8" height="8" rx="1" fill="#1A1816"/>
  <rect x="576" y="428" width="8" height="8" rx="1" fill="#1A1816"/>
  <rect x="548" y="448" width="6" height="6" rx="1" fill="#1A1816"/>

  <text x="600" y="508" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#7A756E" letter-spacing="0.04em">DIGITAL BUSINESS CARD</text>
  <text x="600" y="532" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#A39E97">mykolavoronin.com/card</text>
</svg>
